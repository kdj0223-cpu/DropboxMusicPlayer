name: Build HaruMemo 2.0 APK
on:
  push:
    branches:
      - haru-memo-v2-20260924
    paths:
      - haru-memo-v2/part_*.txt
      - .github/workflows/haru-memo-apk.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore HaruMemo source
        run: |
          mkdir -p haru-memo-v2/workspace
          cat haru-memo-v2/part_{00..05}.txt | base64 -d > /tmp/harumemo2.tar.xz
          echo '64e40e5b73f7dc1a328c01b9df77b90f1f4285c1a3989fd54b32b3f77a659c6d  /tmp/harumemo2.tar.xz' | sha256sum --check
          tar -xJf /tmp/harumemo2.tar.xz -C haru-memo-v2/workspace
          test -f haru-memo-v2/workspace/app/src/main/java/app/harume/memo/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          export PATH="$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"):$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p haru-memo-v2/workspace --no-daemon :app:assembleDebug
      - name: Verify APK
        run: test -s haru-memo-v2/workspace/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HaruMemo-v2-apk
          path: haru-memo-v2/workspace/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
