name: Export HaruMemo 2.12 source
on:
  push:
    branches: [haru-memo-v213-recording-ui-20260925]
    paths: ['.github/workflows/haru-memo-v213-export.yml']
  workflow_dispatch:
jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble v2.12
        run: |
          set -euo pipefail
          mkdir -p work
          cat haru-memo-v2/part_{00..05}.txt | base64 -d > /tmp/v20.tar.xz
          echo '64e40e5b73f7dc1a328c01b9df77b90f1f4285c1a3989fd54b32b3f77a659c6d  /tmp/v20.tar.xz' | sha256sum -c
          tar -xJf /tmp/v20.tar.xz -C work
          cat haru-memo-v21/patch_{00..02}.txt | base64 -d > /tmp/v21.gz
          echo 'a74ce7f1b1ffdb4db7daa79d6ba8ad590b09d5d473df43245cae803ace05f752  /tmp/v21.gz' | sha256sum -c
          gzip -dc /tmp/v21.gz > /tmp/v21.py
          python3 /tmp/v21.py work
          python3 haru-memo-v23/patch.py work
          python3 haru-memo-v25/patch.py work
          python3 haru-memo-v26/01_storage.py work
          python3 haru-memo-v26/02_recordings_ui.py work
          python3 haru-memo-v26/03_title_settings.py work
          cat haru-memo-v27/patch_{00..03}.txt | base64 -d > /tmp/v27.gz
          echo 'fc3e63fa32b0d746dafceb058038e48654acdf9bf1fb096508e69831a80b40c4  /tmp/v27.gz' | sha256sum -c
          gzip -dc /tmp/v27.gz > /tmp/v27.patch
          patch --fuzz=0 -p1 -d work -i /tmp/v27.patch
          cat haru-memo-v28/patch_{00..01}.txt | base64 -d > /tmp/v28.gz
          echo 'f4da5b4afb62f4ab65c36198805efec70d9704570463f968e66c60b779562856  /tmp/v28.gz' | sha256sum -c
          gzip -dc /tmp/v28.gz > /tmp/v28.patch
          patch --fuzz=0 -p1 -d work -i /tmp/v28.patch
          cat haru-memo-v29/patch_{00..01}.txt | base64 -d > /tmp/v29.gz
          echo '0b257e6918446d69cf4c4cb597e477ba6dc6b29080e21fe124fdfb335da7cf0c  /tmp/v29.gz' | sha256sum -c
          gzip -dc /tmp/v29.gz > /tmp/v29.patch
          patch --fuzz=0 -p1 -d work -i /tmp/v29.patch
          cat haru-memo-v30/patch_{00..01}.txt | base64 -d > /tmp/v210.gz
          echo '4e382c1ebb162fa2b24c8d8651f1babf9d2d0fd679a5b041110a8c17390afda7  /tmp/v210.gz' | sha256sum -c
          gzip -dc /tmp/v210.gz > /tmp/v210.patch
          patch --fuzz=0 -p1 -d work -i /tmp/v210.patch
          python3 haru-memo-v211/patch.py work
          python3 haru-memo-v212/patch.py work
          tar -czf /tmp/harumemo212source.tar.gz -C work .
      - uses: actions/upload-artifact@v4
        with:
          name: HaruMemo-v212-source
          path: /tmp/harumemo212source.tar.gz
