name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore Android project
        run: |
          cat ci/project.part00a ci/project.part00b0 ci/project.part00b1 ci/project.part00b2 ci/project.part00c ci/project.part00d ci/project.part01 ci/project.part02 ci/project.part03 ci/project.part04 > project.b64
          base64 -d project.b64 > project.tgz
          echo "febbb41091a109bfe7def3f7faa984dfbe5bf12bc404214cd761cf0340f1bf22  project.tgz" | sha256sum -c -
          tar -xzf project.tgz

      - name: Apply player UI and Dropbox folder update
        run: |
          cat ci/ui_patch.part00 ci/ui_patch.part01 ci/ui_patch.part02 ci/ui_patch.part03 ci/ui_patch.part04 ci/ui_patch.part05 > ui_patch.b64
          base64 -d ui_patch.b64 > ui_patch.tgz
          echo "48ee6c674fbb40936d477ed1d39556d6693682cb90a20a606d8a942080c24637  ui_patch.tgz" | sha256sum -c -
          tar -xzf ui_patch.tgz -C DropboxMusicPlayer

      - name: Build debug APK
        working-directory: DropboxMusicPlayer
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp DropboxMusicPlayer/app/build/outputs/apk/debug/app-debug.apk DropboxMusicPlayer-v3.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DropboxMusicPlayer-v3.2-APK
          path: DropboxMusicPlayer-v3.2.apk
          if-no-files-found: error
