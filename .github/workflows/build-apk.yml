name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore Android project
        run: |
          cat ci/project.part00a ci/project.part00b0 ci/project.part00b1 ci/project.part00b2 ci/project.part00c ci/project.part00d ci/project.part01 ci/project.part02 ci/project.part03 ci/project.part04 > project.b64
          base64 -d project.b64 > project.tgz
          echo "febbb41091a109bfe7def3f7faa984dfbe5bf12bc404214cd761cf0340f1bf22  project.tgz" | sha256sum -c -
          tar -xzf project.tgz

      - name: Apply v3.3 player UI, favorites and playback controls
        run: |
          cat ci/ui_v33.part00 ci/ui_v33.part01 ci/ui_v33.part02 ci/ui_v33.part03 ci/ui_v33.part04 ci/ui_v33.part05 > ui_patch.b64
          base64 -d ui_patch.b64 > ui_patch.tgz
          echo "7a50604df2ae83c06050d0d7554847b5b9ebd6630dc20a6019f8904c67d3529a  ui_patch.tgz" | sha256sum -c -
          tar -xzf ui_patch.tgz -C DropboxMusicPlayer

      - name: Apply v4.0 YouTube mode
        run: |
          cat ci/youtube_v40.part00 ci/youtube_v40.part01 ci/youtube_v40.part02 ci/youtube_v40.part03 ci/youtube_v40.part04 > youtube_v40.b64
          base64 -d youtube_v40.b64 > youtube_v40.tgz
          echo "31c8022e0f35979d534302450b91f6c9ee612143cd559e11aa5739bb0e427e9c  youtube_v40.tgz" | sha256sum -c -
          tar -xzf youtube_v40.tgz -C DropboxMusicPlayer

      - name: Apply v4.0.1 compatibility fix
        run: |
          base64 -d ci/youtube_v401_fix.b64 > youtube_v401_fix.tgz
          echo "fe388b42b78a4fba7917c6f956aaaca6757db8cb3a5fe561da013c3d3256a410  youtube_v401_fix.tgz" | sha256sum -c -
          tar -xzf youtube_v401_fix.tgz -C DropboxMusicPlayer

      - name: Apply v4.1 background and embed fix
        run: |
          cat ci/youtube_v41.part00 ci/youtube_v41.part01 ci/youtube_v41.part02 > youtube_v41.b64
          base64 -d youtube_v41.b64 > youtube_v41.tgz
          echo "6e38011eab6dab6852edf8fd38f50883ae545b09a8a73bc31b2afd8a6481868e  youtube_v41.tgz" | sha256sum -c -
          tar -xzf youtube_v41.tgz -C DropboxMusicPlayer

      - name: Apply v5.0 audio-only YouTube backend
        run: |
          cat ci/youtube_v50.part00 ci/youtube_v50.part01 ci/youtube_v50.part02 ci/youtube_v50.part03 > youtube_v50.b64
          base64 -d youtube_v50.b64 > youtube_v50.tgz
          echo "8bd1126973be82580982c5a79a9c65954fd54da83f6b1ec1cefba8c37eb9f43b  youtube_v50.tgz" | sha256sum -c -
          tar -xzf youtube_v50.tgz -C DropboxMusicPlayer

      - name: Apply v5.1 YouTube favorites list UI
        run: |
          cat ci/youtube_v51.part00 ci/youtube_v51.part01 > youtube_v51.b64
          base64 -d youtube_v51.b64 > youtube_v51.tgz
          echo "0bff057e855ee573fdf5d73be58e66e5707597e8611734e75558422c98f68f6b  youtube_v51.tgz" | sha256sum -c -
          tar -xzf youtube_v51.tgz -C DropboxMusicPlayer

      - name: Apply Nudeong theme base
        run: |
          cat ci/nudeong_v52_text.part00 ci/nudeong_v52_text.part01 ci/nudeong_v52_text.part02 ci/nudeong_v52_text.part03 > nudeong_v52_text.b64
          base64 -d nudeong_v52_text.b64 > nudeong_v52_text.tgz
          echo "2bf79537783f998364d46fe54d1fc82bf36146aa888f811272e611418b3f4f00  nudeong_v52_text.tgz" | sha256sum -c -
          tar -xzf nudeong_v52_text.tgz -C DropboxMusicPlayer
          mkdir -p DropboxMusicPlayer/app/src/main/res/drawable-nodpi
          cp ci/nudeong_phone.webp DropboxMusicPlayer/app/src/main/res/drawable-nodpi/nudeong_phone.webp
          cp ci/nudeong_pair.webp DropboxMusicPlayer/app/src/main/res/drawable-nodpi/nudeong_pair.webp
          cp ci/nudeong_bowl.webp DropboxMusicPlayer/app/src/main/res/drawable-nodpi/nudeong_bowl.webp
          cp ci/nudeong_bottle.webp DropboxMusicPlayer/app/src/main/res/drawable-nodpi/nudeong_bottle.webp
          cp ci/nudeong_progress.webp DropboxMusicPlayer/app/src/main/res/drawable-nodpi/nudeong_progress.webp

      - name: Apply v5.2.4 varied artwork icon playback and inset fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("DropboxMusicPlayer")

          def replace(path, old, new, count=1):
              p = root / path
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"missing pattern in {path}: {old[:100]!r}")
              p.write_text(s.replace(old, new, count))

          def replace_occurrences(path, old, replacements):
              p = root / path
              s = p.read_text()
              parts = s.split(old)
              count = len(parts) - 1
              if count <= 0:
                  raise SystemExit(f"missing drawable occurrences in {path}: {old!r}")
              out = [parts[0]]
              for i in range(count):
                  out.append(replacements[i % len(replacements)])
                  out.append(parts[i + 1])
              p.write_text("".join(out))

          # Version
          replace(Path("app/build.gradle"), "versionCode 9", "versionCode 13")
          replace(Path("app/build.gradle"), "versionName '5.1.1-nudeong'", "versionName '5.2.4-nudeong'")

          # Launcher icon: use the entire original square image exactly, no face crop.
          replace(
              Path("app/src/main/AndroidManifest.xml"),
              'android:allowBackup="true"',
              'android:allowBackup="true"\n        android:icon="@drawable/nudeong_phone"\n        android:roundIcon="@drawable/nudeong_phone"'
          )

          # Use the different user-supplied Nudeong images throughout the app.
          replace_occurrences(
              Path("app/src/main/res/layout/activity_mode_select.xml"),
              "@drawable/nudeong_phone",
              [
                  "@drawable/nudeong_phone",
                  "@drawable/nudeong_bowl",
                  "@drawable/nudeong_bottle",
                  "@drawable/nudeong_pair",
              ]
          )
          replace_occurrences(
              Path("app/src/main/res/layout/activity_main.xml"),
              "@drawable/nudeong_phone",
              [
                  "@drawable/nudeong_pair",
                  "@drawable/nudeong_progress",
                  "@drawable/nudeong_bowl",
              ]
          )
          replace_occurrences(
              Path("app/src/main/res/layout/activity_youtube_library.xml"),
              "@drawable/nudeong_phone",
              [
                  "@drawable/nudeong_bottle",
                  "@drawable/nudeong_pair",
              ]
          )
          replace(Path("app/src/main/res/layout/activity_settings.xml"), "@drawable/nudeong_phone", "@drawable/nudeong_progress")
          replace(Path("app/src/main/res/layout/activity_player.xml"), "@drawable/nudeong_phone", "@drawable/nudeong_bowl")
          replace(Path("app/src/main/res/layout/item_track.xml"), "@drawable/nudeong_pair", "@drawable/nudeong_bottle")

          java_dir = root / "app/src/main/java/com/dongjin/dropboxmusic"

          # Keep titles clear of the Android status bar.
          for name in ["MainActivity.java", "PlayerActivity.java", "SettingsActivity.java", "YoutubePlayerActivity.java"]:
              p = java_dir / name
              s = p.read_text()
              old = "v.setPadding(left + bars.left, top + bars.top, right + bars.right, bottom + bars.bottom);"
              new = "int extraTop = (int) (v.getResources().getDisplayMetrics().density * 4);\n            v.setPadding(left + bars.left, top + bars.top + extraTop, right + bars.right, bottom + bars.bottom);"
              if old in s:
                  p.write_text(s.replace(old, new, 1))

          for name, marker in [
              ("ModeSelectActivity.java", "setContentView(R.layout.activity_mode_select);"),
              ("YoutubeLibraryActivity.java", "setContentView(R.layout.activity_youtube_library);")
          ]:
              p = java_dir / name
              s = p.read_text()
              if "UiInsets.applySystemBars" not in s:
                  p.write_text(s.replace(marker, marker + "\n        UiInsets.applySystemBars(findViewById(android.R.id.content));", 1))

          # Dropbox: tapping the track that is already loaded must not seek to 0.
          p = java_dir / "MainActivity.java"
          s = p.read_text()
          if "Same song: preserve queue" not in s:
              needle = "        List<Track> playlist = adapter.getPlaybackList();\n"
              insert = """        // Same song: preserve queue, exact position, and play/pause state.
                  MediaItem current = controller.getCurrentMediaItem();
                  if (current != null && track.path.equals(current.mediaId)) {
                      startActivity(new Intent(this, PlayerActivity.class));
                      return;
                  }

                  List<Track> playlist = adapter.getPlaybackList();
          """
              if needle not in s:
                  raise SystemExit("Dropbox click insertion point missing")
              p.write_text(s.replace(needle, insert, 1))

          # YouTube: same behavior for the currently loaded video/audio item.
          p = java_dir / "YoutubePlayerActivity.java"
          s = p.read_text()
          if "requestedMediaId = requestedVideoId" not in s:
              old = """    private void buildYoutubeQueueAndPlay() {
                  if (controller == null) return;
                  List<YoutubeTrack> tracks = new YoutubeStore(this).getAll();
          """
              new = """    private void buildYoutubeQueueAndPlay() {
                  if (controller == null) return;

                  MediaItem current = controller.getCurrentMediaItem();
                  String requestedMediaId = requestedVideoId == null ? "" : "youtube:" + requestedVideoId;
                  if (current != null && requestedMediaId.equals(current.mediaId)) {
                      updateAll();
                      return;
                  }

                  List<YoutubeTrack> tracks = new YoutubeStore(this).getAll();
          """
              if old not in s:
                  raise SystemExit("YouTube queue insertion point missing")
              p.write_text(s.replace(old, new, 1))

          (java_dir / "UiInsets.java").write_text("""package com.dongjin.dropboxmusic;

          import android.view.View;

          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;

          public final class UiInsets {
              private UiInsets() {}

              public static void applySystemBars(View root) {
                  final int left = root.getPaddingLeft();
                  final int top = root.getPaddingTop();
                  final int right = root.getPaddingRight();
                  final int bottom = root.getPaddingBottom();
                  ViewCompat.setOnApplyWindowInsetsListener(root, (v, insets) -> {
                      Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars());
                      int extraTop = (int) (v.getResources().getDisplayMetrics().density * 4);
                      v.setPadding(left + bars.left, top + bars.top + extraTop,
                              right + bars.right, bottom + bars.bottom);
                      return insets;
                  });
                  ViewCompat.requestApplyInsets(root);
              }
          }
          """)
          PY

      - name: Apply v5.3 exact mockup UI and fresh install package
        run: |
          python -m pip install --quiet pillow numpy
          python ci/v53/clean_assets.py
          cp ci/v53/activity_main.xml DropboxMusicPlayer/app/src/main/res/layout/activity_main.xml
          cp ci/v53/activity_youtube_library.xml DropboxMusicPlayer/app/src/main/res/layout/activity_youtube_library.xml
          cp ci/v53/activity_player.xml DropboxMusicPlayer/app/src/main/res/layout/activity_player.xml
          cp ci/v53/item_track.xml DropboxMusicPlayer/app/src/main/res/layout/item_track.xml
          cp ci/v53/ic_notifications.xml DropboxMusicPlayer/app/src/main/res/drawable/ic_notifications.xml
          python ci/v53/patch_v53.py

      - name: Verify v5.3 UI package and components
        run: |
          grep -n "applicationId 'com.dongjin.nudeongmusic'" DropboxMusicPlayer/app/build.gradle
          grep -n "versionName '5.3.0-nudeong'" DropboxMusicPlayer/app/build.gradle
          grep -n 'android:name="com.dongjin.dropboxmusic.MainActivity"' DropboxMusicPlayer/app/src/main/AndroidManifest.xml
          grep -n 'android.intent.category.LAUNCHER' DropboxMusicPlayer/app/src/main/AndroidManifest.xml
          grep -n '오늘도' DropboxMusicPlayer/app/src/main/res/layout/activity_main.xml
          grep -n '재생 중' DropboxMusicPlayer/app/src/main/res/layout/activity_player.xml

      - name: Apply v5.4 rollback layout real queue cute font and YouTube recovery
        run: |
          cat ci/v54/patch.part00 ci/v54/patch.part01 ci/v54/patch.part02 ci/v54/patch.part03 ci/v54/patch.part04 ci/v54/patch.part05 > v54patch.b64
          base64 -d v54patch.b64 > v54patch.tgz
          echo "7b555f92e8046b15862b863a429adfe02e8b8a28d29c113c2dd019aefac50336  v54patch.tgz" | sha256sum -c -
          rm -rf v54patch
          mkdir -p v54patch
          tar -xzf v54patch.tgz -C v54patch

          cp v54patch/activity_main.xml DropboxMusicPlayer/app/src/main/res/layout/activity_main.xml
          cp v54patch/activity_youtube_library.xml DropboxMusicPlayer/app/src/main/res/layout/activity_youtube_library.xml
          cp v54patch/activity_player.xml DropboxMusicPlayer/app/src/main/res/layout/activity_player.xml
          cp v54patch/item_queue.xml DropboxMusicPlayer/app/src/main/res/layout/item_queue.xml

          cp v54patch/MainActivity.java DropboxMusicPlayer/app/src/main/java/com/dongjin/dropboxmusic/MainActivity.java
          cp v54patch/YoutubeLibraryActivity.java DropboxMusicPlayer/app/src/main/java/com/dongjin/dropboxmusic/YoutubeLibraryActivity.java
          cp v54patch/PlayerActivity.java DropboxMusicPlayer/app/src/main/java/com/dongjin/dropboxmusic/PlayerActivity.java
          cp v54patch/YoutubePlayerActivity.java DropboxMusicPlayer/app/src/main/java/com/dongjin/dropboxmusic/YoutubePlayerActivity.java
          cp v54patch/PlaybackService.java DropboxMusicPlayer/app/src/main/java/com/dongjin/dropboxmusic/PlaybackService.java
          cp v54patch/YoutubeStreamResolver.java DropboxMusicPlayer/app/src/main/java/com/dongjin/dropboxmusic/YoutubeStreamResolver.java
          cp v54patch/QueueAdapter.java DropboxMusicPlayer/app/src/main/java/com/dongjin/dropboxmusic/QueueAdapter.java

          cp v54patch/themes.xml DropboxMusicPlayer/app/src/main/res/values/themes.xml
          mkdir -p DropboxMusicPlayer/app/src/main/res/color
          cp v54patch/nudeong_tab_bg.xml DropboxMusicPlayer/app/src/main/res/color/nudeong_tab_bg.xml
          cp v54patch/nudeong_tab_text.xml DropboxMusicPlayer/app/src/main/res/color/nudeong_tab_text.xml

          mkdir -p DropboxMusicPlayer/app/src/main/res/font
          curl -L --fail --retry 3             https://raw.githubusercontent.com/google/fonts/main/ofl/jua/Jua-Regular.ttf             -o DropboxMusicPlayer/app/src/main/res/font/jua_regular.ttf

          python v54patch/patch_v54.py

      - name: Verify v5.4 UI and playback fixes
        run: |
          grep -n "versionCode 101" DropboxMusicPlayer/app/build.gradle
          grep -n "versionName '5.4.0-nudeong'" DropboxMusicPlayer/app/build.gradle
          grep -n "com.dongjin.nudeongmusic" DropboxMusicPlayer/app/build.gradle
          grep -n 'android:name="com.dongjin.dropboxmusic.ModeSelectActivity"' DropboxMusicPlayer/app/src/main/AndroidManifest.xml
          grep -n 'android.intent.category.LAUNCHER' DropboxMusicPlayer/app/src/main/AndroidManifest.xml
          test -s DropboxMusicPlayer/app/src/main/res/font/jua_regular.ttf
          grep -n '@font/jua_regular' DropboxMusicPlayer/app/src/main/res/values/themes.xml
          grep -n 'queueRecycler' DropboxMusicPlayer/app/src/main/res/layout/activity_player.xml
          grep -n 'btnSeeAll' DropboxMusicPlayer/app/src/main/res/layout/activity_player.xml
          grep -n 'class QueueAdapter' DropboxMusicPlayer/app/src/main/java/com/dongjin/dropboxmusic/QueueAdapter.java
          grep -n 'VideoStream' DropboxMusicPlayer/app/src/main/java/com/dongjin/dropboxmusic/YoutubeStreamResolver.java
          grep -n 'retriedYoutubeId' DropboxMusicPlayer/app/src/main/java/com/dongjin/dropboxmusic/PlaybackService.java

      - name: Apply v5.5 image alignment marquee and player sizing
        run: |
          cat ci/v55/patch.part00 ci/v55/patch.part01 ci/v55/patch.part02 ci/v55/patch.part03 ci/v55/patch.part04 ci/v55/patch.part05 > v55_patch.b64
          base64 -d v55_patch.b64 > v55_patch.tgz
          echo "a290de46b51a2b067d666d77dcea98bf5d68e2abc53046c365ffe9ca30457961  v55_patch.tgz" | sha256sum -c -
          tar -xzf v55_patch.tgz -C DropboxMusicPlayer
          mkdir -p DropboxMusicPlayer/app/src/main/res/font
          curl -L --fail --retry 3             https://raw.githubusercontent.com/google/fonts/main/ofl/gaegu/Gaegu-Regular.ttf             -o DropboxMusicPlayer/app/src/main/res/font/gaegu_regular.ttf
          test -s DropboxMusicPlayer/app/src/main/res/font/gaegu_regular.ttf

      - name: Verify v5.5 UI fixes
        run: |
          grep -n "versionCode 102" DropboxMusicPlayer/app/build.gradle
          grep -n "versionName '5.5.0-nudeong'" DropboxMusicPlayer/app/build.gradle
          grep -n '@font/gaegu_regular' DropboxMusicPlayer/app/src/main/res/layout/activity_player.xml
          grep -n 'android:ellipsize="marquee"' DropboxMusicPlayer/app/src/main/res/layout/activity_player.xml
          grep -n 'android:ellipsize="marquee"' DropboxMusicPlayer/app/src/main/res/layout/item_track.xml
          grep -n 'android:layout_marginStart="2dp"' DropboxMusicPlayer/app/src/main/res/layout/item_track.xml
          grep -n 'android:scaleType="fitCenter"' DropboxMusicPlayer/app/src/main/res/layout/activity_player.xml
          test -s DropboxMusicPlayer/app/src/main/res/font/gaegu_regular.ttf

      - name: Verify v5.2.4 Nudeong resources and manifest
        run: |
          file DropboxMusicPlayer/app/src/main/res/drawable-nodpi/nudeong_phone.webp
          file DropboxMusicPlayer/app/src/main/res/drawable-nodpi/nudeong_pair.webp
          file DropboxMusicPlayer/app/src/main/res/drawable-nodpi/nudeong_bowl.webp
          file DropboxMusicPlayer/app/src/main/res/drawable-nodpi/nudeong_bottle.webp
          file DropboxMusicPlayer/app/src/main/res/drawable-nodpi/nudeong_progress.webp
          grep -n 'android:icon="@drawable/nudeong_phone"' DropboxMusicPlayer/app/src/main/AndroidManifest.xml
          grep -Rho '@drawable/nudeong_[a-z_]*' DropboxMusicPlayer/app/src/main/res/layout | sort | uniq -c
          grep -n "Same song: preserve queue" DropboxMusicPlayer/app/src/main/java/com/dongjin/dropboxmusic/MainActivity.java
          grep -n "requestedMediaId" DropboxMusicPlayer/app/src/main/java/com/dongjin/dropboxmusic/YoutubePlayerActivity.java

      - name: Pack current source
        run: tar -czf MusicHub-v5.5.0-Nudeong-source.tgz DropboxMusicPlayer

      - name: Upload current source
        uses: actions/upload-artifact@v4
        with:
          name: MusicHub-v5.5.0-Nudeong-Source
          path: MusicHub-v5.5.0-Nudeong-source.tgz
          if-no-files-found: error

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          cp ci/nudeong-stable-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        working-directory: DropboxMusicPlayer
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs DropboxMusicPlayer/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp DropboxMusicPlayer/app/build/outputs/apk/debug/app-debug.apk MusicHub-v5.5.0-Nudeong.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicHub-v5.5.0-Nudeong-APK
          path: MusicHub-v5.5.0-Nudeong.apk
          if-no-files-found: error
