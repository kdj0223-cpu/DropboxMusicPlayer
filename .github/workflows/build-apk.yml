name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore Android project
        run: |
          cat ci/project.part00a ci/project.part00b0 ci/project.part00b1 ci/project.part00b2 ci/project.part00c ci/project.part00d ci/project.part01 ci/project.part02 ci/project.part03 ci/project.part04 > project.b64
          base64 -d project.b64 > project.tgz
          echo "febbb41091a109bfe7def3f7faa984dfbe5bf12bc404214cd761cf0340f1bf22  project.tgz" | sha256sum -c -
          tar -xzf project.tgz

      - name: Apply v3.3 player UI, favorites and playback controls
        run: |
          cat ci/ui_v33.part00 ci/ui_v33.part01 ci/ui_v33.part02 ci/ui_v33.part03 ci/ui_v33.part04 ci/ui_v33.part05 > ui_patch.b64
          base64 -d ui_patch.b64 > ui_patch.tgz
          echo "7a50604df2ae83c06050d0d7554847b5b9ebd6630dc20a6019f8904c67d3529a  ui_patch.tgz" | sha256sum -c -
          tar -xzf ui_patch.tgz -C DropboxMusicPlayer

      - name: Apply v4.0 YouTube mode
        run: |
          cat ci/youtube_v40.part00 ci/youtube_v40.part01 ci/youtube_v40.part02 ci/youtube_v40.part03 ci/youtube_v40.part04 > youtube_v40.b64
          base64 -d youtube_v40.b64 > youtube_v40.tgz
          echo "31c8022e0f35979d534302450b91f6c9ee612143cd559e11aa5739bb0e427e9c  youtube_v40.tgz" | sha256sum -c -
          tar -xzf youtube_v40.tgz -C DropboxMusicPlayer

      - name: Apply v4.0.1 compatibility fix
        run: |
          base64 -d ci/youtube_v401_fix.b64 > youtube_v401_fix.tgz
          echo "fe388b42b78a4fba7917c6f956aaaca6757db8cb3a5fe561da013c3d3256a410  youtube_v401_fix.tgz" | sha256sum -c -
          tar -xzf youtube_v401_fix.tgz -C DropboxMusicPlayer

      - name: Apply v4.1 background and embed fix
        run: |
          cat ci/youtube_v41.part00 ci/youtube_v41.part01 ci/youtube_v41.part02 > youtube_v41.b64
          base64 -d youtube_v41.b64 > youtube_v41.tgz
          echo "6e38011eab6dab6852edf8fd38f50883ae545b09a8a73bc31b2afd8a6481868e  youtube_v41.tgz" | sha256sum -c -
          tar -xzf youtube_v41.tgz -C DropboxMusicPlayer

      - name: Apply v5.0 audio-only YouTube backend
        run: |
          cat ci/youtube_v50.part00 ci/youtube_v50.part01 ci/youtube_v50.part02 ci/youtube_v50.part03 > youtube_v50.b64
          base64 -d youtube_v50.b64 > youtube_v50.tgz
          echo "8bd1126973be82580982c5a79a9c65954fd54da83f6b1ec1cefba8c37eb9f43b  youtube_v50.tgz" | sha256sum -c -
          tar -xzf youtube_v50.tgz -C DropboxMusicPlayer

      - name: Apply v5.1 YouTube favorites list UI
        run: |
          cat ci/youtube_v51.part00 ci/youtube_v51.part01 > youtube_v51.b64
          base64 -d youtube_v51.b64 > youtube_v51.tgz
          echo "0bff057e855ee573fdf5d73be58e66e5707597e8611734e75558422c98f68f6b  youtube_v51.tgz" | sha256sum -c -
          tar -xzf youtube_v51.tgz -C DropboxMusicPlayer

      - name: Apply Nudeong theme to v5.1
        run: |
          cat ci/nudeong_v52_text.part00 ci/nudeong_v52_text.part01 ci/nudeong_v52_text.part02 ci/nudeong_v52_text.part03 > nudeong_v52_text.b64
          base64 -d nudeong_v52_text.b64 > nudeong_v52_text.tgz
          echo "2bf79537783f998364d46fe54d1fc82bf36146aa888f811272e611418b3f4f00  nudeong_v52_text.tgz" | sha256sum -c -
          tar -xzf nudeong_v52_text.tgz -C DropboxMusicPlayer
          mkdir -p DropboxMusicPlayer/app/src/main/res/drawable-nodpi
          cp ci/nudeong_phone.webp DropboxMusicPlayer/app/src/main/res/drawable-nodpi/nudeong_phone.webp
          cp ci/nudeong_pair.webp DropboxMusicPlayer/app/src/main/res/drawable-nodpi/nudeong_pair.webp

      - name: Pack current source
        run: tar -czf MusicHub-v5.1-Nudeong-source.tgz DropboxMusicPlayer

      - name: Upload current source
        uses: actions/upload-artifact@v4
        with:
          name: MusicHub-v5.1-Nudeong-Source
          path: MusicHub-v5.1-Nudeong-source.tgz
          if-no-files-found: error

      - name: Build debug APK
        working-directory: DropboxMusicPlayer
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp DropboxMusicPlayer/app/build/outputs/apk/debug/app-debug.apk MusicHub-v5.1-Nudeong.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicHub-v5.1-Nudeong-APK
          path: MusicHub-v5.1-Nudeong.apk
          if-no-files-found: error
