name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore Android project
        run: |
          base64 -d ci/project.tgz.b64 > project.tgz
          tar -xzf project.tgz

      - name: Build debug APK
        working-directory: DropboxMusicPlayer
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp DropboxMusicPlayer/app/build/outputs/apk/debug/app-debug.apk DropboxMusicPlayer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DropboxMusicPlayer-APK
          path: DropboxMusicPlayer.apk
          if-no-files-found: error
